<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Darwis World Simulator</title>
<style>

[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd4ff;font:700 16px "Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}

.bar{display:block;width:min(320px,70vw);height:22px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
.bar u,#st u{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}
#menu{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;padding:6vw;background:linear-gradient(90deg,rgba(23,50,77,.6),transparent 70%);z-index:5}
#menu h1{margin:0 0 18px;font-size:clamp(34px,9vw,84px);line-height:.95;color:#fff;text-shadow:0 5px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink);transform:rotate(-3deg);transform-origin:left}
#menu .col{display:flex;flex-direction:column;align-items:flex-start}#menu .col .b{min-width:min(240px,60vw)}
#play{background:var(--pink);color:#fff;font-size:clamp(22px,5vw,34px)}

#pn h2{margin:0 0 6px}#pn p{margin:10px 0 2px}

#hud{position:fixed;inset:0;pointer-events:none;z-index:2}#hud button,#joy{pointer-events:auto}
#st{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));background:#fff8e6;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:18px;box-shadow:0 4px 0 var(--ink)}
#st i{display:block;height:8px;margin-top:4px;background:#ddd;border-radius:5px;overflow:hidden}#st u{background:var(--mint)}
#qs{position:absolute;left:max(10px,env(safe-area-inset-left));top:92px;font-size:13px;background:rgba(255,248,230,.85);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;max-width:210px}
#qs .ok{color:#1b8a5a;text-decoration:line-through}
#mm{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:110px;height:110px;border:3px solid var(--ink);border-radius:50%;box-shadow:0 4px 0 var(--ink)}
#pb{position:absolute;right:max(14px,env(safe-area-inset-right));top:136px}
#act{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pink);color:#fff}
#joy{position:absolute;left:24px;bottom:max(24px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid var(--ink)}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
.rb{position:absolute;width:84px;height:84px;border-radius:50%;padding:0;font-size:13px}
#bj{bottom:max(40px,env(safe-area-inset-bottom));right:20px}#br{bottom:max(40px,env(safe-area-inset-bottom));right:116px}#vb{bottom:140px;right:20px;font-size:28px}
#toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:8;text-align:center}
</style>
<script src="three.min.js" onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=function(){window.__go&&__go()};s.onerror=function(){document.getElementById('lm').textContent='Three.js gagal dimuat. Sambungkan internet sekali, atau taruh three.min.js (r128) di folder yang sama dengan index.html.'};document.head.appendChild(s)"></script>

 <div id="st"><b id="co"></b> &nbsp; <b id="lv"></b><i><u id="xf"></u></i></div>

</div>
<div id="menu"><h1>DARWIS<br>WORLD<br>SIMULATOR</h1><div class="col">
 <button class="b" id="play">PLAY</button><button class="b" data-m="set">SETTINGS</button><button class="b" data-m="chr">CHARACTER</button><button class="b" data-m="shop">SHOP</button><button class="b" id="exit">EXIT</button></div></div>

<script>
function start(){
if(window.__st)return;window.__st=1;
const T=THREE,$=i=>document.getElementById(i),R=Math.random,PI=Math.PI,sin=Math.sin,cos=Math.cos,hyp=Math.hypot,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),ri=(a,b)=>a+R()*(b-a),la=(a,b,t)=>a+(((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI)*Math.min(1,t);

const sfx=(f,d,t,v)=>{if(S.sfx)tone(f,d,t,v)};
setInterval(()=>{if(S.mus&&AC&&AC.state=='running')tone([262,330,392,523,440,392,330,294][mi++%8],.5,'sine',.03)},350);
function addExp(n){S.exp+=n;while(S.exp>=S.lvl*100){S.exp-=S.lvl*100;S.lvl++;toast('LEVEL UP! Level '+S.lvl);[523,659,784].forEach((f,i)=>setTimeout(()=>sfx(f,.2,'square',.05),i*120))}hd=1}
function addQ(i,v){if(S.qd[i])return;S.q[i]=Math.min(Q[i].n,S.q[i]+v);hd=1;if(S.q[i]>=Q[i].n){S.qd[i]=1;S.coin+=Q[i].r;addExp(50);toast('Misi selesai! +'+Q[i].r+' koin');sfx(880,.3,'triangle',.06)}}
// scene
const rd=new T.WebGLRenderer({antialias:!mob});rd.setPixelRatio(mob?1:Math.min(devicePixelRatio,2));rd.shadowMap.enabled=true;rd.shadowMap.type=T.PCFSoftShadowMap;$('game').appendChild(rd.domElement);
const sc=new T.Scene(),sk=new T.Color(0x7fd4ff);sc.background=sk;sc.fog=new T.Fog(0x7fd4ff,80,420);
const cam=new T.PerspectiveCamera(60,1,.1,700);
function rs(){rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const amb=new T.HemisphereLight(0xffffff,0x88aa66,.7);sc.add(amb);
const sun=new T.DirectionalLight(0xffffff,.9);sun.castShadow=!!S.sh;rd.shadowMap.enabled=!!S.sh;sun.shadow.mapSize.set(mob?512:1024,mob?512:1024);Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,far:300});sc.add(sun,sun.target);
const MC={},M=c=>MC[c]||(MC[c]=new T.MeshLambertMaterial({color:c,flatShading:true}));
function bx(w,h,d,c,x,y,z,p,s){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=s!==false;m.receiveShadow=true;(p||sc).add(m);return m}
const col=[],wall=(x,z,w,d)=>col.push({x,z,w:w/2,d:d/2});
function fix(p,r){let h=0;for(const c of col){const dx=p.x-c.x,dz=p.z-c.z,ox=c.w+r-Math.abs(dx),oz=c.d+r-Math.abs(dz);if(ox>0&&oz>0){if(ox<oz)p.x+=dx>0?ox:-ox;else p.z+=dz>0?oz:-oz;h=1}}
if(p.x<500){const dx=p.x+150,dz=p.z+120,d=hyp(dx,dz);if(d<32+r){p.x=-150+dx/d*(32+r);p.z=-120+dz/d*(32+r);h=1}const ox=p.x,oz=p.z;p.x=cl(p.x,-235,235);p.z=cl(p.z,-175,186);if(ox!=p.x||oz!=p.z)h=1}return h}
const pl={pos:new T.Vector3(0,0,3),vy:0,rot:0,ph:0,sp:0,veh:null,in:false,ret:null,g:null};
// karakter

for(const s of[-1,1]){let p=new T.Group();p.position.set(s*.28,1.2,0);bx(.4,1.2,.4,0x2b4a7c,0,-.6,0,p);g.add(p);legs.push(p);p=new T.Group();p.position.set(s*.7,2.3,0);bx(.35,1.1,.35,sn,0,-.5,0,p);g.add(p);arms.push(p)}
if(hr==0)bx(.9,.3,.9,0x3b2417,0,3.3,0,g);if(hr==1){bx(.9,.25,.9,0xd4a017,0,3.3,0,g);const c=new T.Mesh(new T.ConeGeometry(.45,.7,5),M(0xd4a017));c.position.y=3.7;g.add(c)}if(hr==3){bx(.9,.3,.9,0x3b2417,0,3.3,0,g);bx(.9,.9,.2,0x3b2417,0,2.8,-.45,g)}
if(ac==1){bx(.95,.2,.95,0xe63946,0,3.4,0,g);bx(.9,.08,.4,0xe63946,0,3.32,.6,g)}if(ac==2)bx(.7,.18,.06,0x111111,0,2.88,.43,g,false);if(ac==3)bx(.8,1,.3,0x2a9d8f,0,1.9,-.4,g);

function rebuild(){const o=pl.g,g=mkChar(S.shirt,S.hair,S.acc,0xffd2a8);if(o){g.position.copy(o.position);g.rotation.y=o.rotation.y;g.visible=o.visible;sc.remove(o)}pl.g=g;sc.add(g)}
// dunia
const doors=[],kiosks=[],NP=[],CN=[],VH=[],CL=[];
const wt=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,64,64);x.fillStyle='#4a6fa5';for(let i=0;i<4;i++)for(let j=0;j<4;j++)x.fillRect(4+i*16,4+j*16,10,10);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;return t})();
function wb(w,h,d,x,z,c){const t=wt.clone();t.needsUpdate=true;t.repeat.set(w/8,h/8);const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:c,map:t}));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;sc.add(m);wall(x,z,w,d)}
function plane(w,d,c,x,y,z){const m=new T.Mesh(new T.PlaneGeometry(w,d),M(c));m.rotation.x=-PI/2;m.position.set(x,y,z);m.receiveShadow=true;sc.add(m)}
function tree(x,z){const s=ri(.8,1.4),t=new T.Mesh(new T.CylinderGeometry(.4*s,.5*s,3*s,6),M(0x8b5a2b));t.position.set(x,1.5*s,z);t.castShadow=true;sc.add(t);[[2.2,4,4.5,0x2e9e4f],[1.6,3,6.5,0x39b85d]].forEach(a=>{const c=new T.Mesh(new T.ConeGeometry(a[0]*s,a[1]*s,7),M(a[3]));c.position.set(x,a[2]*s,z);c.castShadow=true;sc.add(c)});wall(x,z,1,1)}
function house(x,z){const hc=[0xffadad,0xffd6a5,0xfdffb6,0xcaffbf,0x9bf6ff,0xbdb2ff,0xffc6ff][R()*7|0];bx(9,6,9,hc,x,3,z);const r=new T.Mesh(new T.ConeGeometry(7.2,4,4),M([0xc0392b,0x8e44ad,0x2c7fb8][R()*3|0]));r.rotation.y=PI/4;r.position.set(x,8,z);r.castShadow=true;sc.add(r);bx(1.8,3,.3,0x6b3f1d,x,1.5,z+4.6);bx(1.6,1.6,.3,0x9bd7ff,x-2.8,3.5,z+4.55);bx(1.6,1.6,.3,0x9bd7ff,x+2.8,3.5,z+4.55);wall(x,z,9,9);doors.push({x,z:z+5.6})}
function school(cx,cz){bx(26,10,16,0xffd23f,cx,5,cz);bx(27,1,17,0xe63946,cx,10.5,cz);bx(5,6,.5,0x6b3f1d,cx,3,cz+8.1);for(let i=0;i<5;i++)if(i!=2)bx(2.4,2.4,.3,0x9bd7ff,cx-10+i*5,6,cz+8.1);bx(10,1.6,.3,0x2a9d8f,cx,12,cz+8.3);bx(.3,8,.3,0xcccccc,cx+10,14,cz);bx(2.5,1.5,.1,0xe63946,cx+11.3,17,cz);wall(cx,cz,26,16)}
function playground(cx,cz){bx(26,.1,26,0xf2c46d,cx,.05,cz,null,false);bx(3,5,3,0x3498db,cx-8,2.5,cz-4);const s=bx(2,.3,8,0xff6b8b,cx-8,2.8,cz+1.5);s.rotation.x=.6;wall(cx-8,cz-4,3,3);[5,11].forEach(o=>bx(.3,5,.3,0x333333,cx+o-1,2.5,cz-4));bx(6.3,.3,.3,0x333333,cx+7,5,cz-4);bx(1.2,.2,.8,0xffd166,cx+5.5,1.5,cz-4);bx(1.2,.2,.8,0xffd166,cx+8.5,1.5,cz-4);const t=bx(6,.3,1,0x2ecc71,cx,1,cz+8);t.rotation.z=.2;bx(.8,1,1,0x555555,cx,.5,cz+8)}

const l=new T.Mesh(new T.CircleGeometry(30,24),M(0x3fb6e8));l.rotation.x=-PI/2;l.position.set(-150,.04,-120);sc.add(l);
for(let i=0;i<14;i++){const r=ri(25,45),h=ri(50,100),x=-280+i*42+ri(-10,10),z=ri(-250,-205),c=new T.Mesh(new T.ConeGeometry(r,h,6),M(i%2?0x8d99ae:0x7a8aa0)),s=new T.Mesh(new T.ConeGeometry(r*.35,h*.3,6),M(0xffffff));c.position.set(x,h/2-2,z);s.position.set(x,h*.85-2,z);sc.add(c,s)}

function city(){CC.forEach((cx,i)=>CC.forEach((cz,j)=>{
if(i==1&&j==4)return school(cx,cz);if(i==4&&j==4)return playground(cx,cz);
if(Math.abs(cx)<=20&&Math.abs(cz)<=20)return wb(22,ri(45,85),22,cx,cz,[0x9ad1ff,0xffb3c6,0xb8f2c9,0xffe28a][R()*4|0]);

// kendaraan
